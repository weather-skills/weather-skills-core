[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "weather-skills-core"
dynamic = ["version"]
description = "Core library for weather skills: the @weather_skill decorator owning CLI construction, standard-dataset validation, provenance, and output writing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cf-xarray>=0.11",
    "cftime>=1.6",
    "numpy>=2.5",
    "pillow>=10.1",
    "pint-xarray>=0.6",
    # Reads and writes the history in PDF figures; pure Python.
    "pypdf>=5",
    "pyyaml>=6",
    "xarray>=2026.7",
    "zarr>=3.2",
]

[project.urls]
Homepage = "https://github.com/weather-skills/weather-skills-core"
Repository = "https://github.com/weather-skills/weather-skills-core"
Issues = "https://github.com/weather-skills/weather-skills-core/issues"

[project.scripts]
weather-skills-core = "weather_skills_core.linting.cli:main"

[project.optional-dependencies]
# GeoJSON / region: shapely + geopandas (polygon helpers, resolve_region() GeoDataFrame)
geo = ["shapely>=2.1.2", "geopandas>=1.0"]

[dependency-groups]
dev = [
    "geopandas>=1.0",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "ruff>=0.16",
    "shapely>=2.1.2",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_skills_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/weather_skills_core/data/countries.geojson" = "weather_skills_core/data/countries.geojson"
"src/weather_skills_core/data/custom_regions.geojson" = "weather_skills_core/data/custom_regions.geojson"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # zarr-python warns on every consolidated write; consolidated=True is part
    # of the standard dataset contract, so the warning is expected noise in tests.
    "ignore:Consolidated metadata is currently not part in the Zarr format 3 specification",
    # cf_xarray.units optionally wires matplotlib; fine to skip in headless tests.
    "ignore:Import\\(s\\) unavailable to set up matplotlib support",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Lint fixtures are corpus, not library code (and one of them is deliberately
# unparseable).
extend-exclude = ["tests/fixtures/linting"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
